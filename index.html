<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPC</title>
<style>
  *{
    color:white;
    
  }
  img{
image-rendering: pixelated; /* Chrome, Edge, Safari用 */
  image-rendering: crisp-edges; /* Firefox用 */
}
  body{
    background:black;
  }
/* ==========================================
   各ボイス専用リアルタイム鍵盤UI用スタイル (追加部分)
   ========================================== */
.mini-keyboard {
  display: inline-flex;
  position: relative;
  height: 36px;
  background: #111;
  padding: 2px 4px;
  border-radius: 4px;
  user-select: none;
  vertical-align: middle;
}

.mini-key {
  position: relative;
  box-sizing: border-box;
  border: 1px solid #333;
 
}

.mini-key.white {
  width: 8px;
  height: 30px;
  background: #eee;
  z-index: 1;
}

.mini-key.black {
  width: 5px;
  height: 18px;
  background: #222;
  margin-left: -2.5px;
  margin-right: -2.5px;
  z-index: 2;
  border-color: #000;
}

/* ボイスごとの発光カラー (VOICE 0〜7) */
.v-0 .mini-key.active { background: #ff5252 !important;  z-index: 2; }
.v-1 .mini-key.active { background: #ff9800 !important;  z-index: 2; }
.v-2 .mini-key.active { background: #ffd600 !important;  z-index: 2; }
.v-3 .mini-key.active { background: #4caf50 !important;  z-index: 2; }
.v-4 .mini-key.active { background: #00bcd4 !important;  z-index: 2; }
.v-5 .mini-key.active { background: #2196f3 !important;  z-index: 2; }
.v-6 .mini-key.active { background: #9c27b0 !important;  z-index: 2; }
.v-7 .mini-key.active { background: #e91e63 !important;  z-index: 2; }</style>
</head>
<body>

<div class="card">
  <img width="200" src="NANDSP.png">
 <br><br>
  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept=".spc" />
   
  </div>

  <div class="track-info" id="trackInfo">
    <div class="track-title" id="trackTitle">-</div>
    <div class="track-game" id="trackGame"></div>
    <div class="track-meta">
      <span id="trackArtist"></span>
      <span id="trackDumper"></span>
    </div>
  </div>
 <div id="voiceInfo">
    <table>
        <!-- <th>PITCH</th> の下に <th>鍵盤</th> を追加 -->
<thead>
    <tr>
        <th>VOICE</th>
        <th>状態</th>
        <th>音量 L</th>
        <th>音量 R</th>
        <th>音階</th>
        <th>PITCH</th>
        <th>鍵盤</th>
    </tr>
</thead>
        <tbody id="voiceTable"></tbody>
    </table>
</div>
<!-- 鍵盤UIコンテナ (追加部分) -->
<div class="keyboard-container">
  <div class="keyboard" id="keyboard"></div>
</div>
 <canvas id="waveCanvas" width="600" height="120"></canvas>

<div style="display:none">
  <div class="controls">
    <button class="play-btn" id="playBtn" disabled>▶ 再生</button>
  </div>

  <div class="volume-row">
    <span>🔊</span>
    <input type="range" id="volumeSlider" min="0" max="100" value="70" />
    <span id="volumeLabel">70%</span>
  </div>

  <div class="status" id="status">SPCファイルを選択してください</div>

  <div class="footer-note">
    ※ SPC700 CPUとS-DSPを独自にJavaScriptで実装した簡易エミュレータです。
    一部の特殊命令やエコー処理は近似実装のため、曲によっては音が実機と異なる場合があります。
  </div>
</div>
</div>
<script src="spc.js">

</script>
<script>
  // ============================================================================
// SPCファイルパーサー
// .spc フォーマット (v0.30, ヘッダ256byte + RAM 64KB + DSPレジスタ128byte + ...)
// 参考: SPC700 File Format specification
// ============================================================================

function parseSPC(arrayBuffer) {
  const buf = new Uint8Array(arrayBuffer);
  const dv = new DataView(arrayBuffer);

  // ヘッダチェック "SNES-SPC700 Sound File Data"
  const headerText = String.fromCharCode(...buf.slice(0, 33));
  if (!headerText.startsWith('SNES-SPC700')) {
    throw new Error('SPCファイルのヘッダが不正です（SNES-SPC700シグネチャが見つかりません）');
  }

  const hasID666 = buf[0x23] === 26 || buf[0x23] === 27; // 0x1A(26)=タグあり, 0x1B(27)=タグなし版もある実装差異に対応
  // 実際の仕様: offset 0x23 が 0x1A固定でヘッダ終端マーカー、0x24がID666タグの有無(1=あり,0=なし)
  const id666Flag = buf[0x24];

  // レジスタ情報 (offset 0x25-0x2D)
  const pc = dv.getUint16(0x25, true);
  const a = buf[0x27];
  const x = buf[0x28];
  const y = buf[0x29];
  const psw = buf[0x2a];
  const sp = buf[0x2b];

  // ID666タグ (offset 0x2E - 0xD0) 曲情報
  let songTitle = '', gameTitle = '', dumperName = '', comments = '', dateDumped = '';
  let artist = '';
  try {
    songTitle = readTagString(buf, 0x2e, 32);
    gameTitle = readTagString(buf, 0x4e, 32);
    dumperName = readTagString(buf, 0x6e, 16);
    comments = readTagString(buf, 0x7e, 32);
    artist = readTagString(buf, 0xb1, 32);
  } catch (e) {
    // タグが壊れていても再生自体は継続する
  }

  // RAMデータ: offset 0x100 から 65536 byte
  const ramStart = 0x100;
  const ram = buf.slice(ramStart, ramStart + 0x10000);

  // DSPレジスタ: offset 0x10100 から 128 byte
  const dspStart = 0x10100;
  const dspRegs = buf.slice(dspStart, dspStart + 0x80);

  return {
    pc, a, x, y, psw, sp,
    ram,
    dspRegs,
    tags: { songTitle, gameTitle, artist, dumperName, comments },
  };
}

function readTagString(buf, offset, length) {
  let end = offset;
  const max = offset + length;
  while (end < max && buf[end] !== 0) end++;
  const bytes = buf.slice(offset, end);
  // Shift-JISの可能性もあるが、まずUTF-8/ASCIIとしてデコードを試みる
  try {
    return new TextDecoder('shift-jis', { fatal: false }).decode(bytes).trim();
  } catch (e) {
    return String.fromCharCode(...bytes).trim();
  }
}

if (typeof module !== 'undefined') module.exports = { parseSPC };
</script>
<script>
  // ============================================================================
// メインスレッド制御スクリプト
// ファイル選択/ドロップ -> SPCパース -> AudioWorkletへ転送 -> 再生制御
// ============================================================================

(() => {
  
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const playBtn = document.getElementById('playBtn');
  const statusEl = document.getElementById('status');
  const trackInfo = document.getElementById('trackInfo');
  const trackTitle = document.getElementById('trackTitle');
  const trackGame = document.getElementById('trackGame');
  const trackArtist = document.getElementById('trackArtist');
  const trackDumper = document.getElementById('trackDumper');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeLabel = document.getElementById('volumeLabel');
const voiceTable = document.getElementById("voiceTable");
function pitchToNote(pitch) {
    if (!pitch) return "-";

    // SPC700のピッチ値から周波数を概算
    const freq = 32000 * pitch / 4096;

    if (!isFinite(freq) || freq <= 0) {
        return "-";
    }

    const noteNames = [
        "C", "C#", "D", "D#", "E", "F",
        "F#", "G", "G#", "A", "A#", "B"
    ];

    const midi = Math.round(
        69 + 12 * Math.log2(freq / 440)
    );

    const octave = Math.floor(midi / 12) - 1;
    const name = noteNames[((midi % 12) + 12) % 12];

    return `${name}${octave}`;
}
// ============================================================================
// 各ボイス用リアルタイム鍵盤制御 (追加・変更部分)
// ============================================================================
const MIN_MIDI_NOTE = 24;
const MAX_MIDI_NOTE = 108;
const isBlackKey = [false, true, false, true, false, false, true, false, true, false, true, false];
// ピッチからMIDIノート番号を算出 (0x1000 = C4 / MIDI 60)
function pitchToMidi(pitch) {
  if (!pitch || pitch <= 0) return null;
  return Math.round(60 + 12 * Math.log2(pitch / 4096));
}

// 音階名テキスト変換の修正
function pitchToNote(pitch) {
  const midi = pitchToMidi(pitch);
  if (midi === null) return "-";

  const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const octave = Math.floor(midi / 12) - 1;
  const name = noteNames[((midi % 12) + 12) % 12];
  return `${name}${octave}`;
}

// 初期化：8ボイス分のテーブル行と鍵盤DOMをあらかじめ作成
function initVoiceKeyboards() {
  const voiceTable = document.getElementById("voiceTable");
  if (!voiceTable) return;
  voiceTable.innerHTML = "";

  for (let v = 0; v < 8; v++) {
    const tr = document.createElement("tr");
    tr.id = `voice-row-${v}`;

    // 各ボイス専用の鍵盤HTML
    let kbHtml = `<div class="mini-keyboard v-${v}">`;
    for (let note = MIN_MIDI_NOTE; note <= MAX_MIDI_NOTE; note++) {
      const isBlack = isBlackKey[note % 12];
      kbHtml += `<div class="mini-key ${isBlack ? 'black' : 'white'}" data-note="${note}"></div>`;
    }
    kbHtml += `</div>`;

    tr.innerHTML = `
      <td>${v}</td>
      <td class="v-status">-</td>
      <td class="v-vol-l">-</td>
      <td class="v-vol-r">-</td>
      <td class="v-note">-</td>
      <td class="v-pitch">-</td>
      <td>${kbHtml}</td>
    `;
    voiceTable.appendChild(tr);
  }
}

// 【差し替え】既存の updateVoiceInfo 関数をこちらに変更
// updateVoiceInfo 内の鍵盤更新処理
function updateVoiceInfo(voices) {
  voices.forEach((v, index) => {
    const vIdx = v.voice !== undefined ? v.voice : index;
    const row = document.getElementById(`voice-row-${vIdx}`);
    if (!row) return;

    row.querySelector(".v-status").textContent = v.active ? "ON" : "OFF";
    row.querySelector(".v-vol-l").textContent = v.volumeL;
    row.querySelector(".v-vol-r").textContent = v.volumeR;
    row.querySelector(".v-note").textContent = v.active ? pitchToNote(v.pitch) : "-";
    row.querySelector(".v-pitch").textContent = "0x" + v.pitch.toString(16).padStart(4, "0").toUpperCase();

    const kb = row.querySelector(".mini-keyboard");
    if (kb) {
      kb.querySelectorAll(".mini-key.active").forEach(k => k.classList.remove("active"));

      if (v.active) {
        const midi = pitchToMidi(v.pitch);
        if (midi !== null) {
          const key = kb.querySelector(`.mini-key[data-note="${midi}"]`);
          if (key) {
            key.classList.add("active");
          }
        }
      }
    }
  });
}

// 初期化実行 (画面読み込み時に鍵盤列をあらかじめ生成)
initVoiceKeyboards();

  let audioContext = null;
  let workletNode = null;
  let gainNode = null;
  let isPlaying = false;
  let isLoaded = false;
  let currentParsed = null;

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  // --------------------------------------------------------------------
  // AudioContext / AudioWorklet 初期化
  // SDSPは32000Hz固定でサンプルを生成する仕様のため、AudioContextの
  // サンプルレートも32000Hzで作成し、リサンプリングなしで直結する。
  // --------------------------------------------------------------------
  async function ensureAudioContext() {
    if (audioContext) return;

const audioOptions = {
  // サンプルレートを 48000Hz (または 44100Hz) に固定
  sampleRate: 48000, 
  
  // 音質最優先（再生の滑らかさ重視）に設定
  latencyHint: 'playback' 
};

// レガシーブラウザ（フォールバック）対応を含めた初期化
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
audioContext = new AudioContextClass(audioOptions);

   
  

    gainNode = audioContext.createGain();
    gainNode.gain.value = Number(volumeSlider.value) / 100;

    gainNode.connect(audioContext.destination);

    
    
  }

  // --------------------------------------------------------------------
  // ファイル処理
  // --------------------------------------------------------------------
  async function handleFile(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.spc')) {
      setStatus('拡張子が .spc のファイルを選択してください', 'error');
      return;
    }

    setStatus('ファイルを読み込み中...');
    playBtn.disabled = true;
    isLoaded = false;

    try {
      const buf = await file.arrayBuffer();
      const parsed = parseSPC(buf);
      currentParsed = parsed;

      // UI更新: 曲情報表示
      const tags = parsed.tags;
      trackTitle.textContent = tags.songTitle || file.name;
      trackGame.textContent = tags.gameTitle || '';
      trackArtist.textContent = tags.artist ? ('作曲: ' + tags.artist) : '';
      trackDumper.textContent = tags.dumperName ? ('Dump: ' + tags.dumperName) : '';
      trackInfo.classList.add('visible');

      setStatus('オーディオエンジンを初期化中...');
      await ensureAudioContext();

      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

     
const player = new SPCPlayer();

// ボイス情報のコールバック設定（任意）
player.onVoiceInfo = (voices) => {
  updateVoiceInfo(voices);
};

// SPCデータのロードと再生
player.load(currentParsed);
player.play();
      setStatus('読み込み中...');
    } catch (e) {
      console.error(e);
      setStatus('読み込みエラー: ' + e.message, 'error');
    }
  }

  // --------------------------------------------------------------------
  // 再生/停止トグル
  // --------------------------------------------------------------------
  async function togglePlay() {
    if (!isLoaded || !workletNode) return;

    if (audioContext.state === 'suspended') {
      await audioContext.resume();
    }

    if (isPlaying) {
      workletNode.port.postMessage({ type: 'stop' });
      isPlaying = false;
      playBtn.textContent = '▶ 再生';
      playBtn.classList.remove('playing');
      setStatus('停止しました');
    } else {
      workletNode.port.postMessage({ type: 'play' });
      isPlaying = true;
      playBtn.textContent = '⏸ 停止';
      playBtn.classList.add('playing');
      setStatus('再生中...', 'ok');
    }
  }

  // --------------------------------------------------------------------
  // イベントバインド
  // --------------------------------------------------------------------
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    handleFile(file);
  });

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
  dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
  });
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    handleFile(file);
  });

  playBtn.addEventListener('click', togglePlay);

  volumeSlider.addEventListener('input', () => {
    const v = Number(volumeSlider.value);
    volumeLabel.textContent = v + '%';
    if (gainNode) {
      gainNode.gain.value = v / 100;
    }
  });
})();
</script>
</body>
</html>
